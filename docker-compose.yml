services:
  db:
    image: postgres:16-alpine
    container_name: divya-motel-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: devpass
      POSTGRES_DB: divya
    ports:
      - "5433:5432"
    volumes:
      - divya_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d divya"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  divya_pg_data:
